name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "tools/**"
      - "site/**"
      - ".github/**"
      - "docs/**"
      - "LICENSE"
      - "README.md"
      - "CHANGELOG.md"

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build app
        shell: bash
        run: |
          wails build -clean ${{ runner.os == 'Linux' && '-tags webkit2_41' || '' }}

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          OS=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          ARCH=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
          mkdir -p dist
          if [ "$OS" = "macos" ]; then
            (cd build/bin && zip -r "$OLDPWD/dist/vidctl-$OS-$ARCH.zip" vidctl.app)
          elif [ "$OS" = "windows" ]; then
            cp build/bin/vidctl*.exe dist/
            powershell -Command "Compress-Archive -Path dist/* -DestinationPath dist/vidctl-windows-$ARCH.zip -Force"
          else
            cp build/bin/vidctl dist/
            (cd dist && zip "vidctl-$OS-$ARCH.zip" vidctl)
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidctl-${{ matrix.os }}
          path: dist/*.zip

  deb:
    name: Debian package (.deb)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="v1.0.${{ github.run_number }}"
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - name: Build Debian package
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          docker run --rm -e VERSION="$VERSION" -v "$PWD":/src -w /src golang:1.27-bookworm bash -euo pipefail -c '
            set -x
            apt-get update -qq
            apt-get install -yqq --no-install-recommends ca-certificates curl \
              libgtk-3-dev libwebkit2gtk-4.1-dev
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -yqq nodejs
            export PATH="$(go env GOPATH)/bin:$PATH"
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
            wails build -clean -tags webkit2_41
            VER=${VERSION#v}
            ARCH=$(dpkg --print-architecture)
            install -Dm755 build/bin/vidctl pkg/deb/vidctl/usr/bin/vidctl
            install -Dm644 pkg/vidctl.desktop pkg/deb/vidctl/usr/share/applications/vidctl.desktop
            install -Dm644 pkg/icon/vidctl-128.png pkg/deb/vidctl/usr/share/icons/hicolor/128x128/apps/vidctl.png
            install -Dm644 pkg/icon/vidctl-256.png pkg/deb/vidctl/usr/share/icons/hicolor/256x256/apps/vidctl.png
            sed -i "s/^Version:.*/Version: ${VER}/" pkg/deb/vidctl/DEBIAN/control
            dpkg-deb --root-owner-group --build pkg/deb/vidctl pkg/vidctl_${VER}_${ARCH}.deb
            mv pkg/vidctl_${VER}_${ARCH}.deb pkg/vidctl-linux-x64.deb
            ls -lh pkg/vidctl-linux-x64.deb
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidctl-deb
          path: pkg/vidctl-linux-x64.deb

  rpm:
    name: Fedora package (.rpm)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="v1.0.${{ github.run_number }}"
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - name: Build RPM package
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          docker run --rm -e VERSION="$VERSION" -v "$PWD":/src -w /src fedora:latest bash -euo pipefail -c '
            set -e
            dnf install -y -q rpm-build gcc curl git pkgconf-pkg-config \
              gtk3-devel webkit2gtk4.1-devel nodejs
            mkdir -p /root/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
            curl -fsSL https://go.dev/dl/go1.27.1.linux-amd64.tar.gz -o /tmp/go.tgz
            rm -rf /usr/local/go
            tar -C /usr/local -xzf /tmp/go.tgz
            export PATH="/usr/local/go/bin:$PATH"
            export PATH="$(go env GOPATH)/bin:$PATH"
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
            VER=${VERSION#v}
            git config --global --add safe.directory /src
            mkdir -p /tmp/treesrc
            git -C /src archive --format=tar HEAD | tar -x -C /tmp/treesrc
            tar -czf /root/rpmbuild/SOURCES/vidctl-${VER}.tar.gz \
              --transform="s,^\.,vidctl-${VER}," -C /tmp/treesrc .
            sed -i "s/^Version:.*/Version: ${VER}/" /src/pkg/rpm/vidctl.spec
            cp /src/pkg/rpm/vidctl.spec /root/rpmbuild/SOURCES/vidctl.spec
            rpmbuild -bb /root/rpmbuild/SOURCES/vidctl.spec
            cp /root/rpmbuild/RPMS/x86_64/vidctl-*.rpm /src/pkg/
            mv /src/pkg/vidctl-*.rpm /src/pkg/vidctl-linux-x64.rpm
            ls -lh /src/pkg/vidctl-linux-x64.rpm
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidctl-rpm
          path: pkg/vidctl-linux-x64.rpm

  prepare:
    name: Prepare tags
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            BASE="${{ github.ref_name }}"
          else
            BASE="v1.0.${{ github.run_number }}"
          fi
          echo "version=$BASE" >> "$GITHUB_OUTPUT"

      - name: Create tags
        run: |
          BASE="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            git tag "$BASE"
            git push origin "$BASE"
          fi
          for os in windows linux macos; do
            git tag "$BASE-$os"
            git push origin "$BASE-$os"
          done

  release-windows:
    name: Release (Windows)
    needs: [build, prepare]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}-windows

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: vidctl-windows-latest
          path: assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: assets
        shell: bash
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: |
            vidctl v${{ env.VERSION }} — pacote oficial para **Windows 64-bit**.

            Changelog completo: [CHANGELOG.md](https://github.com/fabianoflorentino/vidctl/blob/main/CHANGELOG.md)
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release-linux:
    name: Release (Linux)
    needs: [build, deb, rpm, prepare]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}-linux

    steps:
      - name: Download artifacts (zip, deb e rpm)
        uses: actions/download-artifact@v8
        with:
          name: vidctl-ubuntu-latest
          path: assets
          merge-multiple: true

      - name: Download .deb
        uses: actions/download-artifact@v8
        with:
          name: vidctl-deb
          path: assets
          merge-multiple: true

      - name: Download .rpm
        uses: actions/download-artifact@v8
        with:
          name: vidctl-rpm
          path: assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: assets
        shell: bash
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: |
            vidctl v${{ env.VERSION }} — pacote oficial para **Linux 64-bit** (.zip, .deb e .rpm).

            Changelog completo: [CHANGELOG.md](https://github.com/fabianoflorentino/vidctl/blob/main/CHANGELOG.md)
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release-macos:
    name: Release (macOS)
    needs: [build, prepare]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}-macos

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: vidctl-macos-latest
          path: assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: assets
        shell: bash
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: |
            vidctl v${{ env.VERSION }} — pacote oficial para **macOS arm64**.

            Changelog completo: [CHANGELOG.md](https://github.com/fabianoflorentino/vidctl/blob/main/CHANGELOG.md)
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ github.token }}