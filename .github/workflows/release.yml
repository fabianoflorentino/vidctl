name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build app
        shell: bash
        run: |
          wails build -clean ${{ runner.os == 'Linux' && '-tags webkit2_41' || '' }}

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          OS=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          ARCH=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
          mkdir -p pkg
          if [ "$OS" = "macos" ]; then
            (cd build/bin && zip -r "$OLDPWD/pkg/vidctl-$OS-$ARCH.zip" vidctl.app)
          else
            cp build/bin/vidctl* pkg/
            (cd pkg && zip -r "vidctl-$OS-$ARCH.zip" *)
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidctl-${{ matrix.os }}
          path: pkg/*.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: assets
        shell: bash
        run: sha256sum *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true