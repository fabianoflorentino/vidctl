name: Site sync (release)

# Quando uma release é publicada (disparo único: a tag <versao>-linux), ou
# manualmente via workflow_dispatch, atualiza os links de download do site com
# a nova versão e comita na main — o deploy do GitHub Pages (pages.yml, paths
# site/**) roda sozinho em seguida.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a sincronizar no site (vX.Y.Z)'
        required: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || endsWith(github.event.release.tag_name, '-linux')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION%-linux}"
          fi
          [ -z "$VERSION" ] && { echo "::error::versão vazia"; exit 1; }
          [ "$VERSION" != "${VERSION#v}" ] || VERSION="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync site with latest release
        run: ./site/sync-release.sh "${{ steps.ver.outputs.version }}"

      - name: Commit and push to main
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- site/; then
            echo ">> site já na ${VERSION}; nada a commitar"
            exit 0
          fi
          git add site/index.html
          git commit -m "docs(site): links de download na release ${VERSION}"
          git pull --rebase origin main
          git push origin main